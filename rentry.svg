<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="200" height="32" viewBox="0 0 200 32"
     role="img" aria-label="rentry">
  <style>
    .light { display: inline; }
    .dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .light { display: none; }
      .dark { display: inline; }
    }
  </style>
  <image class="light" x="0" y="0" width="200" height="32"
         preserveAspectRatio="xMidYMid meet" xlink:href="https://i.postimg.cc/vB7TfQ0T/rentry-light.png"/>
  <image class="dark" x="0" y="0" width="200" height="32"
         preserveAspectRatio="xMidYMid meet" xlink:href="https://i.postimg.cc/NM8Fmgd9/rentry-dark.png"/>
</svg>
